
<!DOCTYPE html>
<html>
<head>
    <title>Hello Geotab</title>
    <link rel="stylesheet" href="css/style.css" />

    <script>
        geotab.addin.helloWorld = function (api, state) {

            var center = document.getElementById("center");

            // Create vehicle list
            var listCreator = function (entities) {

                var listElement = document.createElement("ul");

                entities.forEach(function (entity) {

                    var element = document.createElement("li");

                    element.textContent = entity.name;
                    element.setAttribute("data-id", entity.id);

                    listElement.appendChild(element);

                });

                return listElement;
            };

            // Navigate to selected vehicle
            var goToVehicle = function (event) {

                var id = event.target.getAttribute("data-id");

                if (id) {
                    state.gotoPage("device", {
                        id: id
                    });
                }

            };

            // Get vehicles from Geotab
            var refreshPage = function () {

                center.innerHTML = "Loading vehicles...";

                api.call(
                    "Get",
                    {
                        typeName: "Device"
                    },
                    function (result) {

                        center.innerHTML = "";

                        center.appendChild(listCreator(result));

                        center.addEventListener(
                            "click",
                            goToVehicle,
                            false
                        );

                    },
                    function (error) {

                        center.innerHTML = "Error: " + error.message;

                        console.error(error);

                    }
                );

            };

            // Cleanup when leaving
            var clearOnLeaving = function () {

                center.removeEventListener(
                    "click",
                    goToVehicle,
                    false
                );

                center.innerHTML = "";

            };

            return {

                initialize: function (api, state, callback) {

                    document
                        .getElementById("vehiclesButton")
                        .addEventListener("click", function () {

                            state.gotoPage("devices");

                        }, false);

                    callback();

                },

                focus: function (api, state) {

                    refreshPage();

                },

                blur: function (api, state) {

                    clearOnLeaving();

                }

            };

        };
    </script>
</head>

<body>

    <h1>Hello World!</h1>

    <button id="vehiclesButton">
        Go to vehicles page
    </button>

    <button id="sendMessageButton">
        Enviar mensaje
    </button>

    <p id="messageStatus"></p>

    <h3>Current vehicles</h3>

    <div id="center">
        Loading...
    </div>

</body>
</html>
